<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./calculator.png">
 
<!-- PWA / iOS Meta Tags -->
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RF Calculator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://via.placeholder.com/192x192/2563eb/ffffff?text=RF">

<title>RF Power Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(24px, env(safe-area-inset-top)) 16px 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
  }
  .card {
    max-width: 520px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 6px; font-size: 25px; }
  .sub { color: #6b7280; margin-bottom: 22px; }
  label { display:block; font-weight:700; margin: 17px 0 8px; }
  input {
    width:100%;
    padding:15px;
    font-size:20px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    background:#fff;
    -webkit-appearance:none;
  }
  .buttons {
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  button {
    flex:1;
    padding:15px 10px;
    font-size:18px;
    font-weight:700;
    border:0;
    border-radius:12px;
    color:white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #calcBtn { background:#2563eb; }
  #clearBtn { background:#64748b; }
  .result {
    margin-top:20px;
    padding:18px;
    border-radius:14px;
    background:#eef2ff;
    text-align:center;
  }
  .result-label {
    font-size:14px;
    font-weight:700;
    color:#4b5563;
    letter-spacing:.08em;
  }
  #resultValue {
    margin-top:5px;
    font-size:34px;
    font-weight:800;
    color:#111827;
    min-height:42px;
  }
  .formula { margin-top:14px; color:#6b7280; font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>RF Power Calculator</h1>
  <div class="sub">RF Max Power Calculator</div>

  <label for="power">Max Power</label>
  <input id="power" type="number" inputmode="decimal" step="any" placeholder="Enter Max Power">

  <label for="diff">Difference %</label>
  <input id="diff" type="number" inputmode="decimal" step="any" placeholder="Enter Difference %">

  <div class="buttons">
    <button id="calcBtn" type="button">Calculate</button>
    <button id="clearBtn" type="button">Clear</button>
  </div>

  <div class="result">
    <div class="result-label">RESULT</div>
    <div id="resultValue">—</div>
  </div>

  <div class="formula">
    Formula: Round(Max Power × (1 + Difference % ÷ 100), 1 decimal place)
  </div>
</div>

<script>
function calculate() {
  const powerInput = document.getElementById('power');
  const diffInput = document.getElementById('diff');
  const resultValue = document.getElementById('resultValue');

  const power = parseFloat(powerInput.value);
  const diff = parseFloat(diffInput.value);

  if (!Number.isFinite(power) || !Number.isFinite(diff)) {
    resultValue.textContent = 'Please enter values';
    return;
  }

  const result = Math.round(power * (1 + diff / 100) * 10) / 10;

  // 自動把結果帶入 Max Power，清空 Difference %
  powerInput.value = result;
  diffInput.value = '';
  resultValue.textContent = result;
  diffInput.focus();
}

function clearAll() {
  document.getElementById('power').value = '';
  document.getElementById('diff').value = '';
  document.getElementById('resultValue').textContent = '—';
  document.getElementById('power').focus();
}

document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('clearBtn').addEventListener('click', clearAll);

document.getElementById('power').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('diff').focus();
});

document.getElementById('diff').addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});

// 註冊 PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Registered'))
      .catch(err => console.log('Service Worker Failed', err));
  });
}
</script>
</body>
</html>
