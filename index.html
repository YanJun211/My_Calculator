<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./calculator.png">
 
<!-- PWA / iOS Meta Tags -->
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RF Calculator">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://via.placeholder.com/192x192/2563eb/ffffff?text=RF">

<title>RF Power Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(24px, env(safe-area-inset-top)) 16px 30px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
  }
  .card {
    max-width: 520px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 6px; font-size: 25px; }
  .sub { color: #6b7280; margin-bottom: 22px; }
  label { display:block; font-weight:700; margin: 17px 0 8px; }
  input {
    width:100%;
    padding:15px;
    font-size:20px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    background:#fff;
    -webkit-appearance:none;
  }
  .buttons {
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  button {
    flex:1;
    padding:15px 10px;
    font-size:18px;
    font-weight:700;
    border:0;
    border-radius:12px;
    color:white;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #calcBtn { background:#2563eb; }
  #clearBtn { background:#64748b; }
  .result {
    margin-top:20px;
    padding:18px;
    border-radius:14px;
    background:#eef2ff;
    text-align:center;
  }
  .result-label {
    font-size:14px;
    font-weight:700;
    color:#4b5563;
    letter-spacing:.08em;
  }
  #resultValue {
    margin-top:5px;
    font-size:34px;
    font-weight:800;
    color:#111827;
    min-height:42px;
  }
  .formula { margin-top:14px; color:#6b7280; font-size:13px; line-height:1.5; }

  /* 歷史記錄區域專用 CSS */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .history-title {
    font-size: 18px;
    font-weight: 700;
    color: #374151;
  }
  .clear-history-btn {
    background: transparent;
    color: #ef4444;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    cursor: pointer;
  }
  .history-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: 15px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-detail { color: #4b5563; font-weight: 500; }
  .history-right { display: flex; align-items: center; gap: 10px; }
  .history-result { font-weight: 700; color: #2563eb; font-size: 16px; }
  .delete-item-btn {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }
  .empty-history { text-align: center; color: #9ca3af; padding: 10px 0; font-size: 14px; }
</style>
</head>
<body>

<div class="card">
  <h1>RF Power Calculator</h1>
  <div class="sub">RF Max Power Calculator</div>

  <label for="power">Max Power</label>
  <input id="power" type="number" inputmode="decimal" step="any" placeholder="Enter Max Power">

  <label for="diff">Difference %</label>
  <input id="diff" type="number" inputmode="decimal" step="any" placeholder="Enter Difference %">

  <div class="buttons">
    <button id="calcBtn" type="button">Calculate</button>
    <button id="clearBtn" type="button">Clear</button>
  </div>

  <div class="result">
    <div class="result-label">RESULT</div>
    <div id="resultValue">—</div>
  </div>

  <div class="formula">
    Formula: Round(Max Power × (1 + Difference % ÷ 100), 1 decimal place)
  </div>
</div>

<!-- 歷史記錄區塊 -->
<div class="card">
  <div class="history-header">
    <span class="history-title">History</span>
    <button id="clearHistoryBtn" class="clear-history-btn" type="button">Clear All</button>
  </div>
  <ul id="historyList" class="history-list"></ul>
</div>

<script>
const HISTORY_KEY = 'rf_calc_history_data';

// 取得歷史記錄
function getHistory() {
  const data = localStorage.getItem(HISTORY_KEY);
  return data ? JSON.parse(data) : [];
}

// 儲存歷史記錄
function saveHistory(list) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
}

// 渲染歷史記錄列表
function renderHistory() {
  const historyList = document.getElementById('historyList');
  const list = getHistory();
  historyList.innerHTML = '';

  if (list.length === 0) {
    historyList.innerHTML = '<li class="empty-history">No history yet</li>';
    return;
  }

  list.forEach((item, index) => {
    const li = document.createElement('li');
    li.className = 'history-item';
    li.innerHTML = `
      <div class="history-detail">
        ${item.power} × (1 + ${item.diff}%)
      </div>
      <div class="history-right">
        <div class="history-result">= ${item.result}</div>
        <button class="delete-item-btn" onclick="deleteHistoryItem(${index})">✕</button>
      </div>
    `;
    historyList.appendChild(li);
  });
}

// 新增一筆記錄
function addHistoryItem(power, diff, result) {
  const list = getHistory();
  list.unshift({ power, diff, result });
  if (list.length > 20) list.pop(); // 最多保留最新的 20 筆
  saveHistory(list);
  renderHistory();
}

// 刪除單筆記錄
function deleteHistoryItem(index) {
  const list = getHistory();
  list.splice(index, 1);
  saveHistory(list);
  renderHistory();
}

// 清空所有歷史記錄
function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

function calculate() {
  const powerInput = document.getElementById('power');
  const diffInput = document.getElementById('diff');
  const resultValue = document.getElementById('resultValue');

  const power = parseFloat(powerInput.value);
  const diff = parseFloat(diffInput.value);

  if (!Number.isFinite(power) || !Number.isFinite(diff)) {
    resultValue.textContent = 'Please enter values';
    return;
  }

  const result = Math.round(power * (1 + diff / 100) * 10) / 10;

  // 新增至歷史記錄
  addHistoryItem(power, diff, result);

  // 自動把結果帶入 Max Power，清空 Difference %
  powerInput.value = result;
  diffInput.value = '';
  resultValue.textContent = result;
  diffInput.focus();
}

function clearAll() {
  document.getElementById('power').value = '';
  document.getElementById('diff').value = '';
  document.getElementById('resultValue').textContent = '—';
  document.getElementById('power').focus();
}

document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);

document.getElementById('power').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('diff').focus();
});

document.getElementById('diff').addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});

// 初始載入歷史記錄
renderHistory();

// 註冊 PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Registered'))
      .catch(err => console.log('Service Worker Failed', err));
  });
}
</script>
</body>
</html>
